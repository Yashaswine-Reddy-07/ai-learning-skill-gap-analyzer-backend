# Application Information
spring.application.name=skill-gap-analyzer
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration from Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_gap_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initializer
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# LangChain4j AI Configuration
# PRIMARY: Groq (free tier, OpenAI-compatible)
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model-name=${GROQ_MODEL_NAME:llama-3.3-70b-versatile}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.timeout-seconds=30

# FALLBACK: OpenAI / Gemini (paid, used only if Groq fails)
app.ai.fallback.api-key=${AI_API_KEY:}
app.ai.fallback.model-name=${AI_MODEL_NAME:gpt-4o-mini}
app.ai.fallback.timeout-seconds=30

